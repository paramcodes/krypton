name: krypton

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krypton}
      POSTGRES_USER: ${POSTGRES_USER:-krypton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - krypton-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The API image arrives in Stage 2.
  # api:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # The worker image arrives in Stage 4.
  # worker:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  krypton-postgres:
